
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Appointment Confirmed - Sunshine Clinic</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            text-align: center;
            padding: 50px;
            color: #333;
        }
        .confirm-box {
            background: #fff;
            border: 2px solid #28a745;
            border-radius: 12px;
            padding: 30px;
            display: inline-block;
            width: 450px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        h2 {
            color: #28a745;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            margin: 15px 0;
        }
        .btn {
            margin-top: 20px;
            padding: 12px 25px;
            background: #28a745;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
        }
        .btn:hover {
            background: #218838;
        }
        .icon {
            font-size: 40px;
            color: #28a745;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="confirm-box">
        <div class="icon">✅</div>
        <h2>Appointment Confirmed</h2>
        <p>{{ summary }}</p>
        <a href="/" class="btn">← Back to Home</a>
    </div>
</body>
</html>
