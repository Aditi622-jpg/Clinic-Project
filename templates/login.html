
<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - Sunshine Clinic</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #74ebd5, #ACB6E5); display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
        .login-box { background:white; padding:40px; border-radius:12px; box-shadow:0 6px 15px rgba(0,0,0,0.2); width:350px; text-align:center; }
        h2 { margin-bottom:20px; color:#007bff; }
        label { display:block; margin-top:15px; text-align:left; font-weight:bold; }
        input { width:100%; padding:10px; margin-top:5px; border:1px solid #ccc; border-radius:6px; }
        button { margin-top:25px; width:100%; padding:12px; background:#007bff; color:white; border:none; border-radius:6px; font-size:18px; cursor:pointer; }
        button:hover { background:#0056b3; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Admin Login</h2>
        <form method="POST">
            <label>Username:</label>
            <input type="text" name="username" required>
            <label>Password:</label>
            <input type="password" name="password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
