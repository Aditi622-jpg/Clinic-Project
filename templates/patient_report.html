<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Patient Report</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        h1 { color: #007bff; }
        .section { margin-bottom: 20px; }
        .label { font-weight: bold; }
    </style>
</head>
<body>
    <h1>Patient Report - Sunshine Clinic</h1>

    <div class="section">
        <p><span class="label">Name:</span> {{ patient[0] }}</p>
        <p><span class="label">Age:</span> {{ patient[1] }}</p>
        <p><span class="label">Gender:</span> {{ patient[2] }}</p>
        <p><span class="label">Phone:</span> {{ patient[3] }}</p>
        <p><span class="label">Appointment Date:</span> {{ patient[4] }}</p>
    </div>

    <div class="section">
        <p><span class="label">Symptoms:</span> {{ patient[5] }}</p>
        <p><span class="label">Doctor’s Advice:</span> {{ patient[6] if patient[6] else "—" }}</p>
    </div>

    <div class="section">
        <p><span class="label">Summary:</span> {{ patient[7] }}</p>
    </div>
</body>
</html>
